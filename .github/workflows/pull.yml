name: Validate code

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build:
    name: Typescript check, lint, and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ "24.16.0", "24", "26" ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typescript check
        run: npm run typecheck
      - name: ESlint check
        run: npm run lint
      - name: Tests
        run: npm test
