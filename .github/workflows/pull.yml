name: Validate code

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build:
    name: Typescript check, lint, and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ "24.16.0", "24", "26" ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typescript check
        run: npm run typecheck
      - name: ESlint check
        run: npm run lint
      - name: Tests
        run: npm test
