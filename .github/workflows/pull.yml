name: Validate code

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build:
    name: Typescript check, lint, and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ "24.16.0", "24", "26" ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Upgrade npm
        run: npm install -g npm@12
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typescript check
        run: npm run typecheck
      - name: ESlint check
        run: npm run lint
      - name: Tests
        run: npm test
